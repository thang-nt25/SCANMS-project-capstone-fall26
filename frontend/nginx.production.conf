map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_user_agent $is_social_bot {
    default 0;
    ~*(facebookexternalhit|Facebot|ZaloPC|ZaloBot|Twitterbot|TelegramBot|WhatsApp|LinkedInBot|Pinterest|Googlebot|bingbot) 1;
}
upstream scanms_api { server backend:3000; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 55m;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;

    location ~ ^/(api|socket\.io|r)/ {
        proxy_pass http://scanms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ~ ^/(products|p)/[^/]+$ {
        if ($is_social_bot) {
            rewrite ^/(products|p)/([^/]+)$ /api/public/products/$2/seo last;
        }
        try_files $uri /index.html;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location / { try_files $uri $uri/ /index.html; }
}
