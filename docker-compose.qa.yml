# Disposable local QA only. These credentials are not production secrets.
services:
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qa-local-only
      POSTGRES_DB: scanms_fr24_test
    ports:
      - '55432:5432'
    volumes:
      - qa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d scanms_fr24_test']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:qa-local-only@postgres-db:5432/scanms_fr24_test
      JWT_SECRET: qa-local-only-not-a-production-secret
      JWT_REFRESH_SECRET: qa-local-only-refresh-not-a-production-secret
      CORS_ORIGINS: http://127.0.0.1:5183,http://localhost:5183
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ORDER_WEBHOOK_SECRETS: '{"00000000-0000-4000-8000-000000000019:shopify":"qa-webhook-secret-at-least-32-characters"}'
      PAYOUT_VIETQR_BANKS: '[{"bin":"970436","code":"QA","name":"QA Bank","aliases":[]}]'
    ports:
      - '5184:3000'
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_started
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://127.0.0.1:5184/api
      VITE_PROXY_TARGET: http://backend:3000
    ports:
      - '5183:5173'
volumes:
  qa_postgres_data:
