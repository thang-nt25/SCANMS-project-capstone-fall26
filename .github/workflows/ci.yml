name: SCANMS CI/CD Quality Gate Pipeline

on:
  push:
    branches: [ main, dev, develop, thang ]
  pull_request:
    branches: [ main, dev, develop, thang ]

jobs:
  backend-build-check:
    name: Backend Build, Type Check & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

      - name: Build Backend (NestJS Compile Check)
        run: cd backend && npm run build

      - name: Run Backend Unit Tests (Automated CI Verification)
        run: cd backend && npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          JWT_SECRET: "ci_super_secret_jwt_key_test_12345678"
          NODE_ENV: "test"

  frontend-build-check:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Build Frontend (Vite & TypeScript Check)
        run: cd frontend && npm run build
