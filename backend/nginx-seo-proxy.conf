# ==============================================================================
# SCANMS PRODUCTION NGINX REVERSE PROXY & SOCIAL BOT SEO CONFIGURATION (FR-15)
# ==============================================================================
# Tự động nhận diện Social Crawlers (Facebook, Zalo, Twitter, Googlebot, Telegram...)
# khi truy cập /products/{sku} để chuyển tiếp tới Backend Server-Side SEO Renderer.
# Khách hàng người dùng thông thường được phục vụ giao diện React SPA mượt mà.
# ==============================================================================

map $http_user_agent $is_social_bot {
    default 0;
    ~*(facebookexternalhit|Facebot|ZaloPC|ZaloBot|zalo-crawler|Twitterbot|TelegramBot|WhatsApp|LinkedInBot|Pinterest|Googlebot|bingbot) 1;
}

server {
    listen 80;
    server_name scanms.vn www.scanms.vn;

    # 1. URL Sản Phẩm Chuẩn (/products/{sku} hoặc /p/{sku})
    location ~* ^/(products|p)/(?<product_id>[^/]+)$ {
        if ($is_social_bot) {
            # Bot mạng xã hội -> Proxy trực tiếp tới Backend SEO SSR Renderer
            proxy_pass http://127.0.0.1:3000/api/public/products/$product_id/seo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            break;
        }

        # Khách hàng người dùng thật -> Phục vụ ứng dụng React SPA
        root /var/www/scanms/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # 2. Chuyển tiếp API Backend và Link Tiếp Thị (/r/{shortCode})
    location ~* ^/(api|r)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Phục vụ Frontend SPA & Tĩnh
    location / {
        root /var/www/scanms/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
