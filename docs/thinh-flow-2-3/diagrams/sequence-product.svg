<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1882" viewBox="0 0 1260 1882"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1A1612" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="35" font-family="Arial,sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1A1612">Product Submission and Moderation</text><text x="36" y="61" font-family="Arial,sans-serif" font-size="13" text-anchor="start" fill="#1A1612">SCANMS | As implemented; role guards and input validation precede controller execution.</text><rect x="25" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="110" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Shop / Reviewer</text><line x1="110" y1="133" x2="110" y2="1847" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="233" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="318" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Product UI</text><line x1="318" y1="133" x2="318" y2="1847" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="441" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="526" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">ProductsController</text><line x1="526" y1="133" x2="526" y2="1847" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="649" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="734" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">ProductsService</text><line x1="734" y1="133" x2="734" y2="1847" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="857" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="942" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Prisma / PostgreSQL</text><line x1="942" y1="133" x2="942" y2="1847" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="1065" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="1150" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">UploadController</text><line x1="1150" y1="133" x2="1150" y2="1847" stroke="#7D715E" stroke-dasharray="6 5"/><line x1="110" y1="190" x2="318" y2="190" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="214" y="178" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">1. Submit product in assigned category</text><line x1="318" y1="266" x2="1150" y2="266" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="734" y="254" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">2. POST /api/upload/product-cover</text><line x1="1150" y1="342" x2="318" y2="342" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="734" y="330" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">3. Square &gt;=800px; reject invalid cover</text><line x1="318" y1="418" x2="526" y2="418" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="422" y="406" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">4. GET /api/products/identity-check</text><line x1="526" y1="494" x2="734" y2="494" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="630" y="482" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">5. findSimilarProducts(actor, role, query)</text><line x1="734" y1="570" x2="942" y2="570" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="838" y="558" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">6. Own drafts + public approved catalogue</text><line x1="942" y1="646" x2="318" y2="646" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="630" y="634" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">7. Local ONNX cosine &gt;80; user confirms</text><line x1="318" y1="722" x2="526" y2="722" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="422" y="710" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">8. POST /api/products</text><line x1="526" y1="798" x2="734" y2="798" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="630" y="786" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">9. create(actorId, role, dto)</text><line x1="734" y1="874" x2="942" y2="874" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="838" y="862" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">10. Resolve owned or assigned store</text><line x1="942" y1="950" x2="734" y2="950" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="838" y="938" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">11. Store and fixed category</text><line x1="734" y1="1026" x2="526" y2="1026" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="630" y="1014" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">12. [invalid category/evidence] reject 400</text><line x1="734" y1="1102" x2="942" y2="1102" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="838" y="1090" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">13. BEGIN; lock SKU/barcode; reject duplicates</text><line x1="734" y1="1178" x2="942" y2="1178" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="838" y="1166" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">14. [valid] product + maker IDs + variants + media</text><line x1="942" y1="1254" x2="318" y2="1254" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="630" y="1242" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">15. COMMIT: DRAFT; not publicly approved</text><line x1="110" y1="1330" x2="318" y2="1330" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="214" y="1318" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">16. System Manager reviews submission</text><line x1="318" y1="1406" x2="526" y2="1406" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="422" y="1394" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">17. PATCH /api/products/:id/moderation</text><line x1="526" y1="1482" x2="734" y2="1482" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="630" y="1470" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">18. moderateProduct(actorId, id, dto)</text><line x1="734" y1="1558" x2="942" y2="1558" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="838" y="1546" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">19. BEGIN; row lock; re-read current queue</text><line x1="734" y1="1634" x2="526" y2="1634" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="630" y="1622" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">20. [own maker / already reviewed] 403 / 409</text><line x1="734" y1="1710" x2="942" y2="1710" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="838" y="1698" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">21. Decision + audit + notification; COMMIT</text><line x1="942" y1="1786" x2="318" y2="1786" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="630" y="1774" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">22. APPROVED or REJECTED with reason</text></svg>