<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1578" viewBox="0 0 1150 1578"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1A1612" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="35" font-family="Arial,sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1A1612">Product Submission and Moderation</text><text x="36" y="61" font-family="Arial,sans-serif" font-size="13" text-anchor="start" fill="#1A1612">SCANMS | As implemented; role guards and input validation precede controller execution.</text><rect x="25" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="110" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Shop / Reviewer</text><line x1="110" y1="133" x2="110" y2="1543" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="257.5" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="342.5" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Product UI</text><line x1="342.5" y1="133" x2="342.5" y2="1543" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="490" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="575" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">ProductsController</text><line x1="575" y1="133" x2="575" y2="1543" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="722.5" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="807.5" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">ProductsService</text><line x1="807.5" y1="133" x2="807.5" y2="1543" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="955" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="1040" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Prisma / PostgreSQL</text><line x1="1040" y1="133" x2="1040" y2="1543" stroke="#7D715E" stroke-dasharray="6 5"/><line x1="110" y1="190" x2="342.5" y2="190" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="226.25" y="178" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">1. Submit product in assigned category</text><line x1="342.5" y1="266" x2="575" y2="266" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="458.75" y="254" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">2. GET /api/products/identity-check</text><line x1="575" y1="342" x2="807.5" y2="342" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="691.25" y="330" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">3. findSimilarProducts(actor, role, query)</text><line x1="807.5" y1="418" x2="1040" y2="418" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="923.75" y="406" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">4. Own drafts + public approved catalogue</text><line x1="1040" y1="494" x2="342.5" y2="494" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="691.25" y="482" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">5. Local ONNX cosine &gt;80; user confirms</text><line x1="342.5" y1="570" x2="575" y2="570" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="458.75" y="558" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">6. POST /api/products</text><line x1="575" y1="646" x2="807.5" y2="646" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="691.25" y="634" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">7. create(actorId, role, dto)</text><line x1="807.5" y1="722" x2="1040" y2="722" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="923.75" y="710" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">8. Resolve owned or assigned store</text><line x1="1040" y1="798" x2="807.5" y2="798" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="923.75" y="786" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">9. Store and fixed category</text><line x1="807.5" y1="874" x2="575" y2="874" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="691.25" y="862" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">10. [invalid category/evidence] reject 400</text><line x1="807.5" y1="950" x2="1040" y2="950" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="923.75" y="938" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">11. BEGIN; lock SKU/barcode; reject duplicates</text><line x1="807.5" y1="1026" x2="1040" y2="1026" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="923.75" y="1014" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">12. [valid] same transaction: product, variants, media</text><line x1="1040" y1="1102" x2="342.5" y2="1102" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="691.25" y="1090" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">13. COMMIT: DRAFT; not publicly approved</text><line x1="110" y1="1178" x2="342.5" y2="1178" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="226.25" y="1166" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">14. System Manager reviews submission</text><line x1="342.5" y1="1254" x2="575" y2="1254" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="458.75" y="1242" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">15. PATCH /api/products/:id/moderation</text><line x1="575" y1="1330" x2="807.5" y2="1330" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="691.25" y="1318" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">16. moderateProduct(actorId, id, dto)</text><line x1="807.5" y1="1406" x2="1040" y2="1406" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="923.75" y="1394" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">17. Transaction: status + audit + notification</text><line x1="1040" y1="1482" x2="342.5" y2="1482" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="691.25" y="1470" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">18. APPROVED or REJECTED with reason</text></svg>