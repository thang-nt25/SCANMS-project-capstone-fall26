<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="1274" viewBox="0 0 1470 1274"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1A1612" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="35" font-family="Arial,sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1A1612">MAP and Budgeted Price Promotion</text><text x="36" y="61" font-family="Arial,sans-serif" font-size="13" text-anchor="start" fill="#1A1612">SCANMS | As implemented; role guards and input validation precede controller execution.</text><rect x="25" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="110" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Shop</text><line x1="110" y1="133" x2="110" y2="1239" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="233.33333333333337" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="318.33333333333337" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Pricing UI</text><line x1="318.33333333333337" y1="133" x2="318.33333333333337" y2="1239" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="441.66666666666674" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="526.6666666666667" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">PricingController</text><line x1="526.6666666666667" y1="133" x2="526.6666666666667" y2="1239" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="650" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="735" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">PricingService</text><line x1="735" y1="133" x2="735" y2="1239" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="858.3333333333334" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="943.3333333333334" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">PostgreSQL</text><line x1="943.3333333333334" y1="133" x2="943.3333333333334" y2="1239" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="1066.6666666666667" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="1151.6666666666667" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Scheduler</text><line x1="1151.6666666666667" y1="133" x2="1151.6666666666667" y2="1239" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="1275" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="1360" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Checkout</text><line x1="1360" y1="133" x2="1360" y2="1239" stroke="#7D715E" stroke-dasharray="6 5"/><line x1="110" y1="190" x2="318.33333333333337" y2="190" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="214.16666666666669" y="178" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">1. Submit price, SKU, schedule, budget</text><line x1="318.33333333333337" y1="266" x2="526.6666666666667" y2="266" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="422.50000000000006" y="254" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">2. POST /pricing/promotions</text><line x1="526.6666666666667" y1="342" x2="735" y2="342" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="630.8333333333334" y="330" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">3. Validate Store and MAP</text><line x1="735" y1="418" x2="943.3333333333334" y2="418" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="839.1666666666667" y="406" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">4. PENDING + audit + reviewer notification</text><line x1="318.33333333333337" y1="494" x2="526.6666666666667" y2="494" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="422.50000000000006" y="482" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">5. Reviewer: PATCH /:id/review</text><line x1="526.6666666666667" y1="570" x2="735" y2="570" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="630.8333333333334" y="558" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">6. Maker-checker and schedule overlap check</text><line x1="735" y1="646" x2="943.3333333333334" y2="646" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="839.1666666666667" y="634" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">7. APPROVED; activate if start is due</text><line x1="1151.6666666666667" y1="722" x2="735" y2="722" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="943.3333333333334" y="710" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">8. Every 30 seconds: reconcileDue</text><line x1="735" y1="798" x2="943.3333333333334" y2="798" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="839.1666666666667" y="786" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">9. Apply SKU prices or restore MSRP</text><line x1="1360" y1="874" x2="943.3333333333334" y2="874" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1151.6666666666667" y="862" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">10. BEGIN; lock product rows</text><line x1="1360" y1="950" x2="943.3333333333334" y2="950" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1151.6666666666667" y="938" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">11. Validate net-goods MAP and current price</text><line x1="1360" y1="1026" x2="943.3333333333334" y2="1026" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1151.6666666666667" y="1014" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">12. Conditional budget reservation + usage + order</text><line x1="943.3333333333334" y1="1102" x2="1360" y2="1102" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="1151.6666666666667" y="1090" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">13. COMMIT or rollback stock/order/budget</text><line x1="1360" y1="1178" x2="943.3333333333334" y2="1178" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1151.6666666666667" y="1166" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">14. Cancellation: release usage once</text></svg>