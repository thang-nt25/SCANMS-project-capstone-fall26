" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Cache</text><line x1="942" y1="133" x2="942" y2="1087" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="1065" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="1150" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Prisma / PostgreSQL</text><line x1="1150" y1="133" x2="1150" y2="1087" stroke="#7D715E" stroke-dasharray="6 5"/><line x1="110" y1="190" x2="318" y2="190" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="214" y="178" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">1. Open drawer without losing product context</text><line x1="318" y1="266" x2="526" y2="266" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="422" y="254" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">2. GET /api/ai/recommend-kols/:productId</text><line x1="526" y1="342" x2="734" y2="342" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="630" y="330" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">3. getRecommendedKols(query, actor)</text><line x1="734" y1="418" x2="1150" y2="418" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="942" y="406" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">4. Read approved product; verify store access</text><line x1="1150" y1="494" x2="734" y2="494" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="942" y="482" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">5. Product and current authorization</text><line x1="734" y1="570" x2="318" y2="570" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="526" y="558" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">6. [foreign store] 403; never read cache</text><line x1="734" y1="646" x2="942" y2="646" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="838" y="634" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">7. [authorized] key: actor + ALL filters</text><line x1="942" y1="722" x2="734" y2="722" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="838" y="710" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">8. Cached result or miss</text><line x1="734" y1="798" x2="1150" y2="798" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="942" y="786" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">9. [miss] verified profiles, valid clicks, sales</text><line x1="1150" y1="874" x2="734" y2="874" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="942" y="862" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">10. Measured facts; no fabricated fallback</text><line x1="734" y1="950" x2="942" y2="950" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="838" y="938" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">11. Cache cold-start/performance scores</text><line x1="734" y1="1026" x2="318" y2="1026" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="526" y="1014" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">12. Top KOCs, evidence and data confidence</text></svg>