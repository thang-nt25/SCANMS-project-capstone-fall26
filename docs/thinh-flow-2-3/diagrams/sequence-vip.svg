<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="1730" viewBox="0 0 1890 1730"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1A1612" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="36" y="35" font-family="Arial,sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1A1612">VIP Scopes and Independent Exception Approval</text><text x="36" y="61" font-family="Arial,sans-serif" font-size="13" text-anchor="start" fill="#1A1612">SCANMS | As implemented; role guards and input validation precede controller execution.</text><rect x="25" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="110" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Shop / KOC</text><line x1="110" y1="133" x2="110" y2="1695" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="233.75" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="318.75" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">VIP Form</text><line x1="318.75" y1="133" x2="318.75" y2="1695" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="442.5" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="527.5" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">DealsController</text><line x1="527.5" y1="133" x2="527.5" y2="1695" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="651.25" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="736.25" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">DealsService</text><line x1="736.25" y1="133" x2="736.25" y2="1695" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="860" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="945" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Activation policy</text><line x1="945" y1="133" x2="945" y2="1695" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="1068.75" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="1153.75" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">PostgreSQL</text><line x1="1153.75" y1="133" x2="1153.75" y2="1695" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="1277.5" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="1362.5" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Referral service</text><line x1="1362.5" y1="133" x2="1362.5" y2="1695" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="1486.25" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="1571.25" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Socket.IO</text><line x1="1571.25" y1="133" x2="1571.25" y2="1695" stroke="#7D715E" stroke-dasharray="6 5"/><rect x="1695" y="85" width="170" height="48" fill="white" stroke="#1A1612"/><text x="1780" y="114" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1A1612">Admin</text><line x1="1780" y1="133" x2="1780" y2="1695" stroke="#7D715E" stroke-dasharray="6 5"/><line x1="110" y1="190" x2="318.75" y2="190" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="214.375" y="178" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">1. Choose scope, revenue KPI, rate 10-25%</text><line x1="318.75" y1="266" x2="527.5" y2="266" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="423.125" y="254" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">2. POST /offers OR /proposals</text><line x1="527.5" y1="342" x2="736.25" y2="342" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="631.875" y="330" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">3. Validate Store, KYC and scope</text><line x1="736.25" y1="418" x2="1153.75" y2="418" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="945" y="406" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">4. Lock Store/KOC; persist pending card</text><line x1="736.25" y1="494" x2="1571.25" y2="494" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1153.75" y="482" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">5. After commit: new_message</text><line x1="110" y1="570" x2="318.75" y2="570" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="214.375" y="558" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">6. Recipient accepts immutable terms</text><line x1="318.75" y1="646" x2="527.5" y2="646" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="423.125" y="634" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">7. PATCH /accept OR /approve</text><line x1="527.5" y1="722" x2="945" y2="722" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="736.25" y="710" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">8. decideExclusiveDeal</text><line x1="945" y1="798" x2="1153.75" y2="798" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1049.375" y="786" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">9. BEGIN; re-read state and actor rights</text><line x1="945" y1="874" x2="1153.75" y2="874" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1049.375" y="862" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">10. [rate &gt;16] PENDING_ADMIN_APPROVAL</text><line x1="945" y1="950" x2="1780" y2="950" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1362.5" y="938" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">11. [rate &gt;16] Notify independent Admin</text><line x1="1780" y1="1026" x2="527.5" y2="1026" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1153.75" y="1014" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">12. PATCH /:id/exception-review</text><line x1="527.5" y1="1102" x2="945" y2="1102" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="736.25" y="1090" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">13. Admin role, reason, maker-checker</text><line x1="945" y1="1178" x2="1153.75" y2="1178" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1049.375" y="1166" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">14. [&lt;=16 OR Admin approves] APPROVED</text><line x1="945" y1="1254" x2="1362.5" y2="1254" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1153.75" y="1242" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">15. Issue scoped links in caller transaction</text><line x1="1362.5" y1="1330" x2="1153.75" y2="1330" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1258.125" y="1318" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">16. Link records and resource bindings</text><line x1="945" y1="1406" x2="1153.75" y2="1406" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1049.375" y="1394" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">17. Coupon, KPI clock, audit, chat; close prior scope</text><line x1="1153.75" y1="1482" x2="945" y2="1482" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="1049.375" y="1470" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">18. COMMIT; any error rolls back ALL</text><line x1="945" y1="1558" x2="1571.25" y2="1558" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)"/><text x="1258.125" y="1546" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">19. After commit: decision and resources</text><line x1="1571.25" y1="1634" x2="318.75" y2="1634" stroke="#1A1612" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="945" y="1622" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1A1612">20. Authoritative status; no duplicate issuance</text></svg>