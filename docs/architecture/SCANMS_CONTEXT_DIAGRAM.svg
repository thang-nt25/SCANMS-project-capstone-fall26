<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#FAF8F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A1612" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#231D15"/>
      <stop offset="100%" stop-color="#3B3224"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF5EB"/>
      <stop offset="100%" stop-color="#F3EFE6"/>
    </linearGradient>
  </defs>

  <style>
    .title-banner { font-size: 24px; font-weight: 900; fill: #FFFFFF; letter-spacing: 0.8px; }
    .subtitle-banner { font-size: 13px; font-weight: 500; fill: #EEDFC6; }
    .actor-box { fill: #FFFFFF; stroke: #C59B58; stroke-width: 2px; rx: 12px; filter: url(#shadow); }
    .actor-title { font-size: 15px; font-weight: 800; fill: #1A1612; text-anchor: middle; letter-spacing: 0.5px; }
    .actor-sub { font-size: 11px; font-weight: 500; fill: #7D715E; text-anchor: middle; }
    .ext-box { fill: #FFFFFF; stroke: #7D715E; stroke-width: 2px; rx: 12px; filter: url(#shadow); }
    .ext-title { font-size: 14px; font-weight: 800; fill: #1A1612; text-anchor: middle; }
    .ext-sub { font-size: 11px; font-weight: 500; fill: #7D715E; text-anchor: middle; }
    .core-circle { fill: url(#coreGrad); stroke: #C59B58; stroke-width: 4px; filter: url(#shadow); }
    .core-title { font-size: 20px; font-weight: 900; fill: #1A1612; text-anchor: middle; letter-spacing: 0.5px; }
    .core-sub { font-size: 13px; font-weight: 700; fill: #8C6226; text-anchor: middle; }
    .core-code { font-size: 12px; font-weight: 800; fill: #B88E4F; text-anchor: middle; font-family: monospace; }
    .flow-line { fill: none; stroke: #B88E4F; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; }
    .flow-ext-line { fill: none; stroke: #7D715E; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 6,4; }
    .flow-tag { font-size: 10px; font-weight: 600; fill: #1A1612; }
    .flow-pill { fill: #FFFFFF; stroke: #EAE4D7; stroke-width: 1px; rx: 6px; filter: url(#shadow); }
  </style>

  <!-- HEADER BAR -->
  <rect x="30" y="25" width="1860" height="75" rx="14" fill="url(#headerGrad)" />
  <text x="60" y="60" class="title-banner">SCANMS · SƠ ĐỒ NGỮ CẢNH HỆ THỐNG CHUẨN HÓA (REDESIGNED SYSTEM CONTEXT DIAGRAM)</text>
  <text x="60" y="82" class="subtitle-banner">MÔ HÌNH QUẢN LÝ NỘI BỘ CẤP DOANH NGHIỆP ĐA NHÃN HÀNG (FA26SE032) — GIẢI QUYẾT TRIỆT ĐỂ NHẬN XÉT SỐ 1 HỘI ĐỒNG REVIEW 2</text>
  <text x="1860" y="70" font-size="12px" font-weight="700" fill="#C59B58" text-anchor="end">5 ACTORS + 4 TÍCH HỢP NGOẠI VI</text>

  <!-- ================= CENTRAL SYSTEM CIRCLE ================= -->
  <circle cx="960" cy="560" r="190" class="core-circle" />
  <text x="960" y="525" class="core-title">HỆ THỐNG QUẢN LÝ</text>
  <text x="960" y="550" class="core-title">ĐỘI NGŨ CTV BÁN HÀNG &amp;</text>
  <text x="960" y="575" class="core-title">TIẾP THỊ LIÊN KẾT</text>
  <text x="960" y="605" class="core-sub">Sales Collaborator &amp; Affiliate Network</text>
  <text x="960" y="625" class="core-code">(SCANMS — FA26SE032)</text>

  <!-- ================= 5 USER ACTORS (LEFT & TOP & BOTTOM) ================= -->

  <!-- Actor 1: SYSTEM_ADMIN (Top Left) -->
  <rect x="80" y="160" width="310" height="85" class="actor-box" />
  <text x="235" y="195" class="actor-title">SYSTEM_ADMIN</text>
  <text x="235" y="215" class="actor-sub">Ban Giám Đốc / Quản Trị Hệ Thống Tối Cao</text>
  <text x="235" y="232" font-size="10px" font-weight="600" fill="#B88E4F" text-anchor="middle">Khởi tạo Store, Cấp TK, Duyệt Deal &gt;16%, Sổ cái CEO</text>

  <!-- Actor 2: SYSTEM_MANAGER (Mid Left) -->
  <rect x="80" y="380" width="310" height="85" class="actor-box" />
  <text x="235" y="415" class="actor-title">SYSTEM_MANAGER</text>
  <text x="235" y="435" class="actor-sub">Kế Toán Đối Soát &amp; Kiểm Duyệt Vận Hành</text>
  <text x="235" y="452" font-size="10px" font-weight="600" fill="#B88E4F" text-anchor="middle">Duyệt eKYC, Duyệt SP, Trọng tài 14d, Khấu trừ 10% PIT</text>

  <!-- Actor 3: SHOP_MANAGER (Bottom Left) -->
  <rect x="80" y="600" width="310" height="85" class="actor-box" />
  <text x="235" y="635" class="actor-title">SHOP_MANAGER</text>
  <text x="235" y="655" class="actor-sub">Quản Lý 4 Cửa Hàng Nội Bộ (Nhân sự công ty)</text>
  <text x="235" y="672" font-size="10px" font-weight="600" fill="#B88E4F" text-anchor="middle">Khóa ngành hàng, Giá sàn floorPrice, Deal &lt;=16%, Xuất mẫu</text>

  <!-- Actor 4: COLLABORATOR (Bottom Center-Left) -->
  <rect x="80" y="820" width="310" height="85" class="actor-box" />
  <text x="235" y="855" class="actor-title">COLLABORATOR</text>
  <text x="235" y="875" class="actor-sub">Cộng Tác Viên / KOL / KOC (Web &amp; Mobile App)</text>
  <text x="235" y="892" font-size="10px" font-weight="600" fill="#B88E4F" text-anchor="middle">Nộp eKYC, Thỏa thuận Deal, Lấy Link/QR/Voucher, Rút ví</text>

  <!-- Actor 5: CUSTOMER (Top Center) -->
  <rect x="805" y="160" width="310" height="85" class="actor-box" />
  <text x="960" y="195" class="actor-title">CUSTOMER</text>
  <text x="960" y="215" class="actor-sub">Khách Mua Hàng Đã Xác Thực (First-Party)</text>
  <text x="960" y="232" font-size="10px" font-weight="600" fill="#B88E4F" text-anchor="middle">Mua qua Link/QR/Voucher KOL, GHN, Đổi/Trả 14 ngày</text>

  <!-- ================= 4 EXTERNAL SYSTEMS (RIGHT) ================= -->

  <!-- Ext 1: PayOS / VietQR (Top Right) -->
  <rect x="1530" y="160" width="310" height="85" class="ext-box" />
  <text x="1685" y="195" class="ext-title">PayOS / VietQR Gateway</text>
  <text x="1685" y="215" class="ext-sub">Cổng Thanh Toán Trực Tuyến Đơn Hàng</text>
  <text x="1685" y="232" font-size="10px" font-weight="600" fill="#7D715E" text-anchor="middle">Khởi tạo QR thanh toán &amp; Webhook xác nhận tiền vào</text>

  <!-- Ext 2: Giao Hàng Nhanh - GHN (Mid-Top Right) -->
  <rect x="1530" y="380" width="310" height="85" class="ext-box" />
  <text x="1685" y="415" class="ext-title">Giao Hàng Nhanh (GHN Express)</text>
  <text x="1685" y="435" class="ext-sub">Đơn Vị Vận Chuyển Đa Kho Vệ Tinh</text>
  <text x="1685" y="452" font-size="10px" font-weight="600" fill="#7D715E" text-anchor="middle">Vận đơn hàng bán / hàng mẫu, Webhook DELIVERED mốc 14d</text>

  <!-- Ext 3: Ngân Hàng Chi Hộ Napas / BIDV (Mid-Bottom Right) -->
  <rect x="1530" y="600" width="310" height="85" class="ext-box" />
  <text x="1685" y="635" class="ext-title">Hệ Thống Ngân Hàng / Napas 24/7</text>
  <text x="1685" y="655" class="ext-sub">Cổng Giải Ngân Thù Lao Tiếp Thị</text>
  <text x="1685" y="672" font-size="10px" font-weight="600" fill="#7D715E" text-anchor="middle">Thực hiện lệnh chi 90% thực nhận sau khấu trừ 10% Thuế</text>

  <!-- Ext 4: Cloud & Socket Storage (Bottom Right) -->
  <rect x="1530" y="820" width="310" height="85" class="ext-box" />
  <text x="1685" y="855" class="ext-title">Cloud Infrastructure (S3 / R2 / Mail)</text>
  <text x="1685" y="875" class="ext-sub">Hạ Tầng Lưu Trữ File Chat &amp; Email OTP</text>
  <text x="1685" y="892" font-size="10px" font-weight="600" fill="#7D715E" text-anchor="middle">Gửi mã OTP 2FA, lưu ảnh/video mẫu thử, đính kèm Chat</text>

  <!-- ================= CONNECTING DATA FLOWS ================= -->

  <!-- ADMIN -> SCANMS -->
  <path d="M 390 202 L 800 480" class="flow-line" />
  <rect x="440" y="270" width="280" height="34" class="flow-pill" />
  <text x="580" y="291" class="flow-tag" text-anchor="middle">Tạo Store, Cấp TK, Duyệt Deal &gt;16%, Sổ cái</text>

  <!-- SYSMGR -> SCANMS -->
  <path d="M 390 422 L 775 520" class="flow-line" />
  <rect x="440" y="435" width="280" height="34" class="flow-pill" />
  <text x="580" y="456" class="flow-tag" text-anchor="middle">Duyệt eKYC, Duyệt SP, Đổi trả 1-1 / Hoàn tiền Clawback</text>

  <!-- SHOP -> SCANMS -->
  <path d="M 390 642 L 775 600" class="flow-line" />
  <rect x="440" y="605" width="280" height="34" class="flow-pill" />
  <text x="580" y="626" class="flow-tag" text-anchor="middle">Đăng SP + floorPrice, Deal &lt;=16%, Xuất mẫu SLA 14d</text>

  <!-- KOL -> SCANMS -->
  <path d="M 390 862 L 800 640" class="flow-line" />
  <rect x="440" y="770" width="280" height="34" class="flow-pill" />
  <text x="580" y="791" class="flow-tag" text-anchor="middle">Nộp eKYC, Đàm phán Deal, Sinh Link/QR/Voucher, Rút tiền</text>

  <!-- CUSTOMER -> SCANMS -->
  <path d="M 960 245 L 960 370" class="flow-line" />
  <rect x="820" y="285" width="280" height="34" class="flow-pill" />
  <text x="960" y="306" class="flow-tag" text-anchor="middle">Đặt hàng qua Link/QR/Voucher, Khiếu nại 14d</text>

  <!-- SCANMS <-> PayOS -->
  <path d="M 1120 480 L 1530 202" class="flow-ext-line" />
  <rect x="1200" y="270" width="270" height="34" class="flow-pill" />
  <text x="1335" y="291" class="flow-tag" text-anchor="middle">Khởi tạo mã VietQR &amp; Webhook tiền vào</text>

  <!-- SCANMS <-> GHN -->
  <path d="M 1145 520 L 1530 422" class="flow-ext-line" />
  <rect x="1200" y="435" width="270" height="34" class="flow-pill" />
  <text x="1335" y="456" class="flow-tag" text-anchor="middle">Tạo vận đơn đa kho &amp; Webhook DELIVERED</text>

  <!-- SCANMS <-> Bank -->
  <path d="M 1145 600 L 1530 642" class="flow-ext-line" />
  <rect x="1200" y="605" width="270" height="34" class="flow-pill" />
  <text x="1335" y="626" class="flow-tag" text-anchor="middle">Chi trả 90% NET sau khấu trừ 10% Thuế</text>

  <!-- SCANMS <-> Cloud -->
  <path d="M 1120 640 L 1530 862" class="flow-ext-line" />
  <rect x="1200" y="770" width="270" height="34" class="flow-pill" />
  <text x="1335" y="791" class="flow-tag" text-anchor="middle">Gửi mã OTP 2FA &amp; Tệp đính kèm Chat Socket.IO</text>

  <!-- FOOTER BANNER -->
  <rect x="30" y="990" width="1860" height="50" rx="10" fill="#F3EFE6" stroke="#EAE4D7" />
  <text x="60" y="1020" font-size="12px" font-weight="700" fill="#1A1612">QUY CHUẨN NGHIỆP VỤ BẤT BIẾN:</text>
  <text x="270" y="1020" font-size="11.5px" font-weight="600" fill="#7D715E">• Cửa hàng &amp; Shop Manager là NỘI BỘ Doanh nghiệp (Do Admin tạo) — Không có luồng tự đăng ký mở Shop ngoài.</text>
  <text x="960" y="1020" font-size="11.5px" font-weight="600" fill="#7D715E">• Tiền bán hàng về két chung doanh nghiệp — Shop Manager không có ví rút tiền.</text>
  <text x="1860" y="1020" font-size="11px" font-weight="700" fill="#B88E4F" text-anchor="end">SCANMS V2.1 · CHUẨN REVIEW 2</text>
</svg>
