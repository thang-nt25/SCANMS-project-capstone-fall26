    .subtitle-banner { font-size: 13px; font-weight: 500; fill: #EEDFC6; }
    .group-box { fill: #FAF8F5; stroke: #EAE4D7; stroke-width: 1.5px; stroke-dasharray: 6,4; rx: 16px; }
    .group-title { font-size: 12px; font-weight: 800; fill: #7D715E; letter-spacing: 1px; text-transform: uppercase; }
