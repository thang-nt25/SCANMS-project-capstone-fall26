    .conn-path-core { fill: none; stroke: #B88E4F; stroke-width: 2.2px; stroke-linecap: round; stroke-linejoin: round; }
    .card-label { font-size: 12px; font-weight: 800; fill: #8C6226; text-anchor: middle; font-family: monospace; }
