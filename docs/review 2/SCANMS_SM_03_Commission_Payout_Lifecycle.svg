<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <!-- UML Open Arrowhead -->
    <marker id="arrowhead-open" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 1 L 7 4.5 L 0 8" fill="none" stroke="#000000" stroke-width="1.6" />
    </marker>
  </defs>

  <!-- Clean Pure White Canvas -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Transitions (Strict Solid Lines, Zero Diagonals) -->
  
      <!-- Edge: start -> comm_pending -->
      <path d="M 74 75 L 240 75" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="101.5" y="53" width="111" height="14" fill="#FFFFFF" rx="2" />
        <text x="157" y="63" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Record Commission</tspan>
        </text>
      </g>
    

      <!-- Edge: comm_pending -> comm_reversed -->
      <path d="M 440 75 L 730 75" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="529.5" y="53" width="111" height="14" fill="#FFFFFF" rx="2" />
        <text x="585" y="63" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Revoke Commission</tspan>
        </text>
      </g>
    

      <!-- Edge: comm_reversed -> end_reversed -->
      <path d="M 930 75 L 1055 75" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="945" y="53" width="94" height="14" fill="#FFFFFF" rx="2" />
        <text x="992" y="63" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Reverse Ledger</tspan>
        </text>
      </g>
    

      <!-- Edge: comm_pending -> comm_approved -->
      <path d="M 340 100 L 340 170" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="352" y="128" width="117" height="14" fill="#FFFFFF" rx="2" />
        <text x="354" y="135" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Release Commission</tspan>
        </text>
      </g>
    

      <!-- Edge: comm_approved -> payout_pending -->
      <path d="M 340 220 L 340 290" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="352" y="248" width="94" height="14" fill="#FFFFFF" rx="2" />
        <text x="354" y="255" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Request Payout</tspan>
        </text>
      </g>
    

      <!-- Edge: payout_pending -> payout_processing -->
      <path d="M 340 340 L 340 410" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="352" y="368" width="94" height="14" fill="#FFFFFF" rx="2" />
        <text x="354" y="375" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Process Payout</tspan>
        </text>
      </g>
    

      <!-- Edge: payout_processing -> payout_rejected -->
      <path d="M 440 435 L 730 435" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="541" y="413" width="88" height="14" fill="#FFFFFF" rx="2" />
        <text x="585" y="423" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Reject Payout</tspan>
        </text>
      </g>
    

      <!-- Edge: payout_rejected -> end_rejected -->
      <path d="M 930 435 L 1055 435" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="948" y="413" width="88" height="14" fill="#FFFFFF" rx="2" />
        <text x="992" y="423" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Restore Funds</tspan>
        </text>
      </g>
    

      <!-- Edge: payout_processing -> payout_paid -->
      <path d="M 340 460 L 340 530" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="352" y="488" width="99" height="14" fill="#FFFFFF" rx="2" />
        <text x="354" y="495" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Transfer Payout</tspan>
        </text>
      </g>
    

      <!-- Edge: payout_paid -> end_paid -->
      <path d="M 240 555 L 75 555" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="113" y="533" width="88" height="14" fill="#FFFFFF" rx="2" />
        <text x="157" y="543" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Settle Payout</tspan>
        </text>
      </g>
    

  <!-- States & Nodes (Clean Single Boxes, English) -->
  
        <!-- Initial State: Start (Label placed cleanly ABOVE circle) -->
        <circle cx="60" cy="75" r="14" fill="#000000" />
        <text x="60" y="55" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">Start</text>
      

        <!-- State: comm_pending -->
        <g id="state-comm_pending">
          <rect x="240" y="50" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="340" y="80" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Commission Pending</text>
        </g>
      

        <!-- State: comm_reversed -->
        <g id="state-comm_reversed">
          <rect x="730" y="50" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="830" y="80" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Commission Reversed</text>
        </g>
      

        <!-- Final State: End (Label placed cleanly BELOW circle) -->
        <circle cx="1070" cy="75" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
        <circle cx="1070" cy="75" r="8" fill="#000000" />
        <text x="1070" y="103" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">End</text>
      

        <!-- State: comm_approved -->
        <g id="state-comm_approved">
          <rect x="240" y="170" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="340" y="200" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Commission Approved</text>
        </g>
      

        <!-- State: payout_pending -->
        <g id="state-payout_pending">
          <rect x="240" y="290" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="340" y="320" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Payout Pending</text>
        </g>
      

        <!-- State: payout_processing -->
        <g id="state-payout_processing">
          <rect x="240" y="410" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="340" y="440" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Payout Processing</text>
        </g>
      

        <!-- State: payout_rejected -->
        <g id="state-payout_rejected">
          <rect x="730" y="410" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="830" y="440" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Payout Rejected</text>
        </g>
      

        <!-- Final State: End (Label placed cleanly BELOW circle) -->
        <circle cx="1070" cy="435" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
        <circle cx="1070" cy="435" r="8" fill="#000000" />
        <text x="1070" y="463" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">End</text>
      

        <!-- State: payout_paid -->
        <g id="state-payout_paid">
          <rect x="240" y="530" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="340" y="560" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Payout Paid</text>
        </g>
      

        <!-- Final State: End (Label placed cleanly BELOW circle) -->
        <circle cx="60" cy="555" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
        <circle cx="60" cy="555" r="8" fill="#000000" />
        <text x="60" y="583" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">End</text>
      
</svg>