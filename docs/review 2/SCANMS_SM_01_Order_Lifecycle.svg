<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 835" width="1190" height="835">
  <defs>
    <!-- UML Open Arrowhead -->
    <marker id="arrowhead-open" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 1 L 7 4.5 L 0 8" fill="none" stroke="#000000" stroke-width="1.6" />
    </marker>
  </defs>

  <!-- Clean Pure White Canvas -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Transitions (Strict Solid Lines, Zero Diagonals) -->
  
      <!-- Edge: start -> pending -->
      <path d="M 74 75 L 240 75" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="116" y="53" width="82" height="14" fill="#FFFFFF" rx="2" />
        <text x="157" y="63" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Create Order</tspan>
        </text>
      </g>
    

      <!-- Edge: pending -> cancelled -->
      <path d="M 420 75 L 720 75" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="529" y="53" width="82" height="14" fill="#FFFFFF" rx="2" />
        <text x="570" y="63" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Cancel Order</tspan>
        </text>
      </g>
    

      <!-- Edge: cancelled -> end_cancelled -->
      <path d="M 900 75 L 1045 75" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="934" y="53" width="76" height="14" fill="#FFFFFF" rx="2" />
        <text x="972" y="63" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Close Order</tspan>
        </text>
      </g>
    

      <!-- Edge: pending -> shipping -->
      <path d="M 330 100 L 330 180" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="342" y="133" width="70" height="14" fill="#FFFFFF" rx="2" />
        <text x="344" y="140" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Ship Order</tspan>
        </text>
      </g>
    

      <!-- Edge: shipping -> delivered -->
      <path d="M 330 230 L 330 310" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="342" y="263" width="105" height="14" fill="#FFFFFF" rx="2" />
        <text x="344" y="270" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Confirm Delivery</tspan>
        </text>
      </g>
    

      <!-- Edge: delivered -> completed -->
      <path d="M 330 360 L 330 440" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="342" y="393" width="94" height="14" fill="#FFFFFF" rx="2" />
        <text x="344" y="400" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Complete Order</tspan>
        </text>
      </g>
    

      <!-- Edge: completed -> end_completed -->
      <path d="M 240 465 L 75 465" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="116" y="443" width="82" height="14" fill="#FFFFFF" rx="2" />
        <text x="157" y="453" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Settle Order</tspan>
        </text>
      </g>
    

      <!-- Edge: delivered -> return_req -->
      <path d="M 420 335 L 720 335" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="523" y="313" width="94" height="14" fill="#FFFFFF" rx="2" />
        <text x="570" y="323" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Request Return</tspan>
        </text>
      </g>
    

      <!-- Edge: return_req -> returned -->
      <path d="M 900 335 L 960 335 L 960 595 L 900 595" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="972" y="458" width="88" height="14" fill="#FFFFFF" rx="2" />
        <text x="974" y="465" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Accept Return</tspan>
        </text>
      </g>
    

      <!-- Edge: return_req -> disputed -->
      <path d="M 810 360 L 810 440" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="822" y="393" width="88" height="14" fill="#FFFFFF" rx="2" />
        <text x="824" y="400" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Reject Return</tspan>
        </text>
      </g>
    

      <!-- Edge: disputed -> returned -->
      <path d="M 810 490 L 810 570" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="822" y="523" width="123" height="14" fill="#FFFFFF" rx="2" />
        <text x="824" y="530" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Arbitrate for Buyer</tspan>
        </text>
      </g>
    

      <!-- Edge: disputed -> completed -->
      <path d="M 720 465 L 420 465" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="511.5" y="443" width="117" height="14" fill="#FFFFFF" rx="2" />
        <text x="570" y="453" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Arbitrate for Shop</tspan>
        </text>
      </g>
    

      <!-- Edge: returned -> end_returned -->
      <path d="M 810 620 L 810 695" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="822" y="650" width="82" height="14" fill="#FFFFFF" rx="2" />
        <text x="824" y="657" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Refund Order</tspan>
        </text>
      </g>
    

  <!-- States & Nodes (Clean Single Boxes, English) -->
  
        <!-- Initial State: Start (Label placed cleanly ABOVE circle) -->
        <circle cx="60" cy="75" r="14" fill="#000000" />
        <text x="60" y="55" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">Start</text>
      

        <!-- State: pending -->
        <g id="state-pending">
          <rect x="240" y="50" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="330" y="80" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Pending</text>
        </g>
      

        <!-- State: cancelled -->
        <g id="state-cancelled">
          <rect x="720" y="50" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="810" y="80" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Cancelled</text>
        </g>
      

        <!-- Final State: End (Label placed cleanly BELOW circle) -->
        <circle cx="1060" cy="75" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
        <circle cx="1060" cy="75" r="8" fill="#000000" />
        <text x="1060" y="103" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">End</text>
      

        <!-- State: shipping -->
        <g id="state-shipping">
          <rect x="240" y="180" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="330" y="210" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Shipping</text>
        </g>
      

        <!-- State: delivered -->
        <g id="state-delivered">
          <rect x="240" y="310" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="330" y="340" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Delivered</text>
        </g>
      

        <!-- State: completed -->
        <g id="state-completed">
          <rect x="240" y="440" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="330" y="470" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Completed</text>
        </g>
      

        <!-- Final State: End (Label placed cleanly BELOW circle) -->
        <circle cx="60" cy="465" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
        <circle cx="60" cy="465" r="8" fill="#000000" />
        <text x="60" y="493" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">End</text>
      

        <!-- State: return_req -->
        <g id="state-return_req">
          <rect x="720" y="310" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="810" y="340" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Return Requested</text>
        </g>
      

        <!-- State: disputed -->
        <g id="state-disputed">
          <rect x="720" y="440" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="810" y="470" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Disputed</text>
        </g>
      

        <!-- State: returned -->
        <g id="state-returned">
          <rect x="720" y="570" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="810" y="600" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Returned</text>
        </g>
      

        <!-- Final State: End (Label placed cleanly BELOW circle) -->
        <circle cx="810" cy="710" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
        <circle cx="810" cy="710" r="8" fill="#000000" />
        <text x="810" y="738" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">End</text>
      
</svg>