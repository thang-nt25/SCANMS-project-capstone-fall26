<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 850" width="980" height="850">
  <defs>
    <!-- UML Open Arrowhead -->
    <marker id="arrowhead-open" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 1 L 7 4.5 L 0 8" fill="none" stroke="#000000" stroke-width="1.6" />
    </marker>
  </defs>

  <!-- Clean Pure White Canvas -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Transitions (Strict Solid Lines, Zero Diagonals) -->
  
      <!-- Edge: start -> draft -->
      <path d="M 74 75 L 240 75" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="116" y="53" width="82" height="14" fill="#FFFFFF" rx="2" />
        <text x="157" y="63" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Create Draft</tspan>
        </text>
      </g>
    

      <!-- Edge: draft -> pending_appr -->
      <path d="M 330 100 L 330 180" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="342" y="133" width="111" height="14" fill="#FFFFFF" rx="2" />
        <text x="344" y="140" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Submit for Review</tspan>
        </text>
      </g>
    

      <!-- Edge: pending_appr -> rejected -->
      <path d="M 420 192 L 720 192" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="523" y="170" width="94" height="14" fill="#FFFFFF" rx="2" />
        <text x="570" y="180" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Reject Product</tspan>
        </text>
      </g>
    

      <!-- Edge: rejected -> pending_appr -->
      <path d="M 720 218 L 420 218" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="508.5" y="228" width="123" height="14" fill="#FFFFFF" rx="2" />
        <text x="570" y="230" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Resubmit for Review</tspan>
        </text>
      </g>
    

      <!-- Edge: pending_appr -> approved -->
      <path d="M 330 230 L 330 310" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="342" y="263" width="99" height="14" fill="#FFFFFF" rx="2" />
        <text x="344" y="270" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Approve Product</tspan>
        </text>
      </g>
    

      <!-- Edge: approved -> active -->
      <path d="M 330 360 L 330 440" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="342" y="393" width="99" height="14" fill="#FFFFFF" rx="2" />
        <text x="344" y="400" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Publish Listing</tspan>
        </text>
      </g>
    

      <!-- Edge: active -> out_of_stock -->
      <path d="M 420 452 L 720 452" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="526" y="430" width="88" height="14" fill="#FFFFFF" rx="2" />
        <text x="570" y="440" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Deplete Stock</tspan>
        </text>
      </g>
    

      <!-- Edge: out_of_stock -> active -->
      <path d="M 720 478 L 420 478" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="514.5" y="488" width="111" height="14" fill="#FFFFFF" rx="2" />
        <text x="570" y="490" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Restock Inventory</tspan>
        </text>
      </g>
    

      <!-- Edge: active -> inactive -->
      <path d="M 300 490 L 300 570" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="200" y="523" width="88" height="14" fill="#FFFFFF" rx="2" />
        <text x="286" y="530" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="end">
          <tspan font-weight="700" fill="#000000">Pause Listing</tspan>
        </text>
      </g>
    

      <!-- Edge: inactive -> active -->
      <path d="M 360 570 L 360 490" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="372" y="523" width="94" height="14" fill="#FFFFFF" rx="2" />
        <text x="374" y="530" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Resume Listing</tspan>
        </text>
      </g>
    

      <!-- Edge: active -> suspended -->
      <path d="M 410 490 L 410 540 L 810 540 L 810 570" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="560.5" y="518" width="99" height="14" fill="#FFFFFF" rx="2" />
        <text x="610" y="528" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Suspend Product</tspan>
        </text>
      </g>
    

      <!-- Edge: inactive -> deleted -->
      <path d="M 330 620 L 330 700" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="342" y="653" width="94" height="14" fill="#FFFFFF" rx="2" />
        <text x="344" y="660" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="start">
          <tspan font-weight="700" fill="#000000">Delete Product</tspan>
        </text>
      </g>
    

      <!-- Edge: suspended -> deleted -->
      <path d="M 810 620 L 810 725 L 420 725" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="559.5" y="703" width="111" height="14" fill="#FFFFFF" rx="2" />
        <text x="615" y="713" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Take Down Product</tspan>
        </text>
      </g>
    

      <!-- Edge: deleted -> end_deleted -->
      <path d="M 240 725 L 75 725" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrowhead-open)" />
      
      <!-- Label with Protective White Background (No collision with arrow or box) -->
      <g>
        <rect x="107.5" y="703" width="99" height="14" fill="#FFFFFF" rx="2" />
        <text x="157" y="713" font-family="Segoe UI, Roboto, sans-serif" font-size="9.5" text-anchor="middle">
          <tspan font-weight="700" fill="#000000">Archive Product</tspan>
        </text>
      </g>
    

  <!-- States & Nodes (Clean Single Boxes, English) -->
  
        <!-- Initial State: Start (Label placed cleanly ABOVE circle) -->
        <circle cx="60" cy="75" r="14" fill="#000000" />
        <text x="60" y="55" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">Start</text>
      

        <!-- State: draft -->
        <g id="state-draft">
          <rect x="240" y="50" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="330" y="80" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Draft</text>
        </g>
      

        <!-- State: pending_appr -->
        <g id="state-pending_appr">
          <rect x="240" y="180" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="330" y="210" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Pending Approval</text>
        </g>
      

        <!-- State: rejected -->
        <g id="state-rejected">
          <rect x="720" y="180" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="810" y="210" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Rejected</text>
        </g>
      

        <!-- State: approved -->
        <g id="state-approved">
          <rect x="240" y="310" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="330" y="340" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Approved</text>
        </g>
      

        <!-- State: active -->
        <g id="state-active">
          <rect x="240" y="440" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="330" y="470" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Active</text>
        </g>
      

        <!-- State: out_of_stock -->
        <g id="state-out_of_stock">
          <rect x="720" y="440" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="810" y="470" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Out of Stock</text>
        </g>
      

        <!-- State: inactive -->
        <g id="state-inactive">
          <rect x="240" y="570" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="330" y="600" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Inactive</text>
        </g>
      

        <!-- State: suspended -->
        <g id="state-suspended">
          <rect x="720" y="570" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="810" y="600" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Suspended</text>
        </g>
      

        <!-- State: deleted -->
        <g id="state-deleted">
          <rect x="240" y="700" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
          <text x="330" y="730" font-family="Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Deleted</text>
        </g>
      

        <!-- Final State: End (Label placed cleanly BELOW circle) -->
        <circle cx="60" cy="725" r="15" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
        <circle cx="60" cy="725" r="8" fill="#000000" />
        <text x="60" y="753" font-family="Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">End</text>
      
</svg>